services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
    depends_on:
      - prometheus
      - loki
      - zipkin
    restart: unless-stopped
    networks:
      - backend

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - backend

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/config.yaml"
    restart: unless-stopped
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    networks:
      - backend

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - backend

  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  consul-config:
    image: hashicorp/consul:1.21
    container_name: consul-config
    entrypoint: ["/bin/sh", "/scripts/load-config.sh"]
    volumes:
      - ./config/load-config.sh:/scripts/load-config.sh:ro
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  product-db:
    image: postgres:17
    container_name: product-db
    environment:
      POSTGRES_DB: db_product
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_product"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  currency-db:
    image: postgres:17
    container_name: currency-db
    environment:
      POSTGRES_DB: db_currency
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - currency_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_currency"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: db_user
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  order-db:
    image: postgres:17
    container_name: order-db
    environment:
      POSTGRES_DB: db_order
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_order" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  product-api:
    build:
      context: ../product-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: "$${spring.application.name}:$${HOSTNAME}"
      IMAGES_LOCATION: /data/images
    volumes:
      - product_images:/data/images
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      consul-config:
        condition: service_completed_successfully
      product-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  currency-api:
    build:
      context: ../currency-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: "$${spring.application.name}:$${HOSTNAME}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8100/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      consul-config:
        condition: service_completed_successfully
      currency-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  auth-api:
    build:
      context: ../auth-api
    container_name: auth-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LETTERA_ADMIN_EMAIL: ${LETTERA_ADMIN_EMAIL:-admin@admin.dev}
      LETTERA_ADMIN_PASSWORD: ${LETTERA_ADMIN_PASSWORD:?Set LETTERA_ADMIN_PASSWORD in .env}
      LETTERA_DEMO_BUYER_PASSWORD: ${LETTERA_DEMO_BUYER_PASSWORD:?Set LETTERA_DEMO_BUYER_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      consul-config:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  gateway-api:
    build:
      context: ../gateway-api
    container_name: gateway-api
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      consul-config:
        condition: service_completed_successfully
      auth-api:
        condition: service_healthy
      product-api:
        condition: service_healthy
      currency-api:
        condition: service_healthy
      order-api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  order-api:
    build:
      context: ../order-api
    container_name: order-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8300/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      consul-config:
        condition: service_completed_successfully
      order-db:
        condition: service_healthy
      product-api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  product_data:
  currency_data:
  auth_data:
  order_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  product_images:
